/* Border beam: a blurred conic-gradient spinning behind the button, clipped by
   overflow:hidden on the wrap so the blur can never escape past the pill's own
   rounded edge, no matter the gradient's current angle. No mask-composite
   (cross-browser landmine) and no unclipped blur (the earlier bug: blur paints
   outside an element's own box by design, and without a clipping ancestor it
   spilled into the page as a stray streak). */
.ar-beam-wrap{
  position:relative;
  display:inline-flex;
  border-radius:calc(var(--radius-sm) + 3px);
  padding:3px;
  overflow:hidden;
  isolation:isolate;
}
.ar-beam-wrap::before{
  content:"";
  position:absolute;
  inset:-10px;
  border-radius:inherit;
  background:conic-gradient(from 0deg, transparent 0%, rgba(254,253,255,.95) 6%, var(--text-accent,#A090FF) 14%, transparent 28%);
  filter:blur(8px);
  animation:ar-beam-spin 3.2s linear infinite;
  z-index:0;
}
.ar-beam-wrap > *{ position:relative; z-index:1; }
@keyframes ar-beam-spin{to{transform:rotate(360deg)}}
</style>
