/* Border beam: a conic-gradient ring spinning behind the button; the button's
   own opaque fill covers the center, leaving only a thin rotating rim of light. */
.ar-beam-wrap{
  position:relative;
  display:inline-flex;
  border-radius:calc(var(--radius-sm) + 2px);
  padding:2px;
  isolation:isolate;
}
.ar-beam-wrap::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:conic-gradient(from 0deg, transparent 0%, rgba(254,253,255,.95) 5%, var(--text-accent,#A090FF) 12%, transparent 22%);
  animation:ar-beam-spin 3.2s linear infinite;

}
.ar-beam-wrap > *{ position:relative; z-index:1; }
@keyframes ar-beam-spin{to{transform:rotate(360deg)}}
