<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;padding:0;width:1280px;height:854px;overflow:hidden}
.tile{display:grid;grid-template-columns:1fr 220px;width:1280px;height:854px}
.main{background:var(--ar-violet-500);display:grid;place-items:center}
.main span{font-family:var(--font-core);font-weight:600;font-size:200px;letter-spacing:-.05em;color:var(--ar-chalk-0);line-height:1;white-space:nowrap}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
.strip i{display:block}
</style></head>
<body><div class="tile">
<div class="main"><span>Arium</span></div>
<div class="strip">
<i style="background:#B3A7FF"></i>
<i style="background:#8C7AFF"></i>
<i style="background:#4E39F0"></i>
<i style="background:#151046"></i>
</div>
</div></body></html>
